name: Update CBECC Download Statistics Wiki (Accordion Style)

on:
  schedule:
 #   - cron: "0 */6 * * *"   # updates every 6 hours
    - cron: "0 8 * * *"      # runs daily at 8 AM
  workflow_dispatch:

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch releases from GitHub API
        run: |
          curl -s "https://api.github.com/repos/california-energy-commission/CBECC/releases" > releases.json

      - name: Build accordion-style Markdown
        run: |
          echo "# Download Statistics" > CBECC-Download-Statistics.md
          echo "" >> CBECC-Download-Statistics.md
        #  echo "Last updated: $(date -u +"%Y-%m-%d %H:%M UTC")" >> CBECC-Download-Statistics.md
          echo "Last updated: $(TZ='America/Los_Angeles' date +"%Y-%m-%d %H:%M %Z")" >> CBECC-Download-Statistics.md
          echo "" >> CBECC-Download-Statistics.md

          releases=$(jq length releases.json)

          for ((i=0; i<releases; i++)); do
            name=$(jq -r ".[$i].name // .[$i].tag_name" releases.json)
            tag=$(jq -r ".[$i].tag_name" releases.json)
            published=$(jq -r ".[$i].published_at" releases.json)

            echo "<details>" >> CBECC-Download-Statistics.md
            echo "  <summary><strong>${name}</strong></summary> " >> CBECC-Download-Statistics.md
            echo "" >> CBECC-Download-Statistics.md

            echo "**Published:** ${published}" >> CBECC-Download-Statistics.md
            echo "" >> CBECC-Download-Statistics.md

            echo "### Assets" >> CBECC-Download-Statistics.md
            echo "| Name | Size | Downloads |" >> CBECC-Download-Statistics.md
            echo "|------|------|-----------|" >> CBECC-Download-Statistics.md

            assets=$(jq ".[$i].assets | length" releases.json)

            for ((j=0; j<assets; j++)); do
              a_name=$(jq -r ".[$i].assets[$j].name" releases.json)
              a_url=$(jq -r ".[$i].assets[$j].browser_download_url" releases.json)
              a_size=$(jq -r ".[$i].assets[$j].size" releases.json)
              a_dl=$(jq -r ".[$i].assets[$j].download_count" releases.json)

              size_mb=$(echo "scale=2; $a_size / 1048576" | bc)

               echo "| [$a_name]($a_url) | ${size_mb} MB | ${a_dl} |" >> CBECC-Download-Statistics.md
            done

            echo "" >> CBECC-Download-Statistics.md
            echo "</details>" >> CBECC-Download-Statistics.md
            echo "" >> CBECC-Download-Statistics.md
            echo "---" >> CBECC-Download-Statistics.md
            echo "" >> CBECC-Download-Statistics.md
          done

      - name: Clone Wiki repository
        run: |
         git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Update Wiki Page
        run: |
          cp CBECC-Download-Statistics.md wiki/CBECC-Download-Statistics.md
          cd wiki
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add CBECC-Download-Statistics.md
          git commit -m "Automated accordion-style wiki update on $(date -u +"%Y-%m-%d %H:%M UTC")" || echo "No changes"
          git push
